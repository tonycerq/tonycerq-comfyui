[project]
name = "tonycerq-comfyui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "huggingface-hub==0.30.1",
    "liger-kernel==0.5.9",
    "protobuf>=6.32.1",
    "protobug>=0.3.0",
    "requests>=2.31.0",
    "sentencepiece>=0.2.1",
    "tdqm>=0.0.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers==4.51.0",
]


[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
